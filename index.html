<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Sabu ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    overflow: hidden;
    background: #09050b;
    font-family: Georgia, serif;
}

/* =========================
   FIRST 5 SECOND SCREEN
========================= */

.intro {
    width: 100vw;
    height: 100vh;
    background:
        radial-gradient(circle at center, #4b1934 0%, #1b0b18 45%, #09050b 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    position: relative;
    overflow: hidden;
}

.intro::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
        radial-gradient(circle, rgba(255,255,255,0.7) 1px, transparent 1px);
    background-size: 45px 45px;
    opacity: 0.18;
    animation: stars 8s linear infinite;
}

@keyframes stars {
    from {
        transform: translateY(0);
    }
    to {
        transform: translateY(-45px);
    }
}

.intro-text {
    position: relative;
    z-index: 2;
    color: #fff4f7;
    opacity: 0;
    animation: textAppear 2s ease forwards;
    animation-delay: 0.7s;
}

.intro-text .heart {
    font-size: 45px;
    margin-bottom: 25px;
    animation: heartBeat 1.6s infinite;
}

.intro-text h1 {
    font-size: clamp(34px, 8vw, 62px);
    font-weight: normal;
    letter-spacing: 1px;
}

.intro-text p {
    margin-top: 18px;
    font-family: Arial, sans-serif;
    font-size: 15px;
    letter-spacing: 3px;
    color: #e9b7c9;
}

@keyframes textAppear {
    0% {
        opacity: 0;
        transform: translateY(25px);
    }
    100% {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes heartBeat {
    0%, 100% {
        transform: scale(1);
    }
    50% {
        transform: scale(1.18);
    }
}

/* Fade out after 5 seconds */

.intro.fade-out {
    animation: fadeOut 1.2s ease forwards;
}

@keyframes fadeOut {
    to {
        opacity: 0;
        transform: scale(1.04);
    }
}


/* =========================
   OPEN SCREEN
========================= */

.open-screen {
    display: none;
    width: 100vw;
    height: 100vh;
    background:
        radial-gradient(circle at center, #5b203f 0%, #241020 42%, #0b060c 100%);
    justify-content: center;
    align-items: center;
    text-align: center;
    position: relative;
    overflow: hidden;
}

.open-screen::before {
    content: "";
    position: absolute;
    width: 350px;
    height: 350px;
    border-radius: 50%;
    background: rgba(225, 91, 132, 0.13);
    filter: blur(70px);
    animation: glow 4s ease-in-out infinite;
}

@keyframes glow {
    0%, 100% {
        transform: scale(0.9);
        opacity: 0.5;
    }
    50% {
        transform: scale(1.15);
        opacity: 1;
    }
}

.open-content {
    position: relative;
    z-index: 2;
}

.open-content .small-heart {
    font-size: 32px;
    margin-bottom: 20px;
    animation: heartBeat 1.6s infinite;
}

.open-button {
    display: inline-block;
    padding: 17px 45px;
    border: 1px solid #e4a5b9;
    border-radius: 50px;
    color: #fff;
    text-decoration: none;
    font-family: Arial, sans-serif;
    font-size: 14px;
    letter-spacing: 4px;
    transition: all 0.4s ease;
    animation: buttonGlow 2.5s ease-in-out infinite;
}

.open-button:hover {
    background: rgba(228,165,185,0.15);
    transform: scale(1.05);
}

@keyframes buttonGlow {
    0%, 100% {
        box-shadow: 0 0 0 rgba(228,165,185,0);
    }
    50% {
        box-shadow: 0 0 30px rgba(228,165,185,0.25);
    }
}
</style>
</head>

<body>

<!-- =========================
     5 SECOND INTRO
========================= -->

<div class="intro" id="intro">

    <div class="intro-text">

        <div class="heart">❤️</div>

        <h1>Hey Sabu,</h1>

        <p>This is for you.</p>

    </div>

</div>


<!-- =========================
     OPEN SCREEN
========================= -->

<div class="open-screen" id="openScreen">

    <div class="open-content">

        <div class="small-heart">♡</div>

        <a href="#" class="open-button">
            OPEN
        </a>

    </div>

</div>


<script>

setTimeout(function() {

    document.getElementById("intro").classList.add("fade-out");

    setTimeout(function() {

        document.getElementById("intro").style.display = "none";

        document.getElementById("openScreen").style.display = "flex";

    }, 1200);

}, 5000);

</script>
<!-- =========================
     BIRTHDAY PAGE AFTER OPEN
========================= -->

<style>

.birthday-page {
    display: none;
    width: 100vw;
    min-height: 100vh;
    background:
        radial-gradient(circle at 50% 35%, #7a294f 0%, #351426 42%, #0c060c 100%);
    position: fixed;
    inset: 0;
    z-index: 100;
    overflow: hidden;
    color: #fff;
    justify-content: center;
    align-items: center;
    text-align: center;
}

.birthday-page::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
        radial-gradient(circle, rgba(255,255,255,0.7) 1px, transparent 1px);
    background-size: 42px 42px;
    opacity: 0.18;
    animation: birthdayStars 10s linear infinite;
}

@keyframes birthdayStars {
    from {
        transform: translateY(0);
    }
    to {
        transform: translateY(-42px);
    }
}


/* Floating hearts */

.birthday-page::after {
    content: "♥  ✦  ♥  ✦  ♥";
    position: absolute;
    top: 15%;
    left: 0;
    width: 100%;
    font-size: 20px;
    letter-spacing: 35px;
    color: rgba(255,190,210,0.35);
    animation: floatingHearts 7s ease-in-out infinite;
}

@keyframes floatingHearts {
    0%,100% {
        transform: translateY(20px);
        opacity: .3;
    }

    50% {
        transform: translateY(-30px);
        opacity: .8;
    }
}

.birthday-content {
    position: relative;
    z-index: 5;
    padding: 25px;
    width: 100%;
    max-width: 800px;
}


/* First Birthday Text */

.birthday-title {
    font-size: clamp(32px, 8vw, 65px);
    line-height: 1.15;
    letter-spacing: 2px;
    font-weight: normal;
    opacity: 0;
}

.birthday-title.show {
    animation: birthdayTitle 5s ease forwards;
}

@keyframes birthdayTitle {

    0% {
        opacity: 0;
        transform: scale(.85);
        filter: blur(10px);
    }

    20% {
        opacity: 1;
        transform: scale(1);
        filter: blur(0);
    }

    75% {
        opacity: 1;
        transform: scale(1);
    }

    100% {
        opacity: 0;
        transform: scale(1.05);
    }
}


/* Second Bangla Message */

.birthday-message {
    display: none;
    font-size: clamp(24px, 6vw, 42px);
    line-height: 1.6;
    color: #ffe9f0;
    font-weight: normal;
}

.birthday-message.show {
    display: block;
    animation: messageAppear 4s ease forwards;
}

@keyframes messageAppear {

    0% {
        opacity: 0;
        transform: translateY(30px);
    }

    100% {
        opacity: 1;
        transform: translateY(0);
    }
}


/* Second Birthday Title */

.birthday-repeat {
    display: none;
    font-size: clamp(30px, 7vw, 60px);
    line-height: 1.2;
    letter-spacing: 2px;
}

.birthday-repeat.show {
    display: block;
    animation: repeatAppear 3s ease forwards;
}

@keyframes repeatAppear {

    0% {
        opacity: 0;
        transform: scale(.8);
    }

    100% {
        opacity: 1;
        transform: scale(1);
    }
}


/* Final OPEN */

.final-open {
    display: none;
    margin-top: 35px;
    padding: 17px 48px;
    border: 1px solid #f2b1c5;
    border-radius: 50px;
    color: white;
    text-decoration: none;
    font-family: Arial, sans-serif;
    letter-spacing: 4px;
    font-size: 14px;
    animation: finalOpenGlow 2s ease-in-out infinite;
}

.final-open.show {
    display: inline-block;
}

@keyframes finalOpenGlow {

    0%,100% {
        box-shadow: 0 0 0 rgba(255,180,205,0);
    }

    50% {
        box-shadow: 0 0 35px rgba(255,180,205,.35);
    }
}

</style>


<!-- =========================
     NEW BIRTHDAY PAGE
========================= -->

<div class="birthday-page" id="birthdayPage">

    <div class="birthday-content">

        <!-- 1st text -->

        <div class="birthday-title" id="birthdayTitle">

            HAPPY BIRTHDAY<br>
            MY DEAR BEAUTIFUL WIFE. ❤️

        </div>


        <!-- 2nd text -->

        <div class="birthday-message" id="birthdayMessage">

            তোমার জন্য সুন্দর কিছু মুহূর্ত<br>
            অপেক্ষা করছে। ❤️

        </div>


        <!-- Birthday text again -->

        <div class="birthday-repeat" id="birthdayRepeat">

            HAPPY BIRTHDAY<br>
            MY DEAR BEAUTIFUL WIFE. ❤️

        </div>


        <!-- Final open -->

        <a href="#" class="final-open" id="finalOpen">

            OPEN ❤️

        </a>

    </div>

</div>


<script>

/* =========================
   OPEN BUTTON
========================= */

document.getElementById("openScreen").querySelector(".open-button").addEventListener("click", function(event) {

    event.preventDefault();

    /* Hide old OPEN screen */

    document.getElementById("openScreen").style.display = "none";


    /* Show Birthday Page */

    const birthdayPage = document.getElementById("birthdayPage");

    birthdayPage.style.display = "flex";


    /* First animation */

    const birthdayTitle = document.getElementById("birthdayTitle");

    birthdayTitle.classList.add("show");


    /* After first 5 seconds */

    setTimeout(function() {

        birthdayTitle.style.display = "none";

        const birthdayMessage = document.getElementById("birthdayMessage");

        birthdayMessage.classList.add("show");


        /* After second message */

        setTimeout(function() {

            birthdayMessage.style.display = "none";

            const birthdayRepeat = document.getElementById("birthdayRepeat");

            birthdayRepeat.classList.add("show");


            /*
             * Music will be connected here later.
             * When the music file is added,
             * this timing will be synchronized with it.
             */

            setTimeout(function() {

                birthdayRepeat.style.display = "none";

                document.getElementById("finalOpen").classList.add("show");

            }, 3000);

        }, 4000);

    }, 5000);

});

</script>
</body>
</html>
